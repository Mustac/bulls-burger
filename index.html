<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulls Burger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* One world: a burger bar after dark. The page colour matches the photos so they blend in.
     Phone: hero photo, headline, then burger photo, picker and builder stacked. Wide: headline over the dark side of the hero; photo left, builder right. */
  --char:#150c07;
  --coal:#21160f;
  --ember:#302119;
  --bone:#f6ecdd;
  --ash:#c2b1a0;
  --mustard:#e9a53a;
  --ketchup:#ec5a41;
  --pickle:#9bcb58;
  --line:rgba(246,236,221,.14);
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--char);color:var(--bone);font-family:var(--body);font-size:16px;line-height:1.5}
body.has-cart{padding-bottom:88px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.price{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}


.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:8px;color:var(--bone);text-decoration:none}
.brand b{font-family:var(--display);font-weight:500;font-style:italic;font-size:25px;line-height:1;display:block;letter-spacing:-.01em}
.brand small{display:block;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--mustard);margin-top:3px}
.top-actions{display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 11px;font-size:14px;font-weight:600;min-height:40px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill:hover{border-color:var(--ash)}
.pill.solid{background:var(--bone);color:#1c1410;border-color:var(--bone)}
.badge{background:var(--ketchup);color:#fff;border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:12px;font-weight:700;padding:0 6px;font-variant-numeric:tabular-nums}

.banner{position:relative}
.banner-img{display:block;position:relative}
.banner-img img{display:block;width:100%;height:auto}
.steam{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.banner-img::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,var(--char) 0,transparent 12%,transparent 60%,var(--char) 100%),linear-gradient(to right,var(--char) 0,transparent 18%)}
.banner-copy{position:relative;margin-top:-64px;display:grid;gap:12px;justify-items:start;padding-bottom:30px}
.banner-copy .cta{flex:none;padding:0 26px;margin-top:4px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ash)}
.status i{width:9px;height:9px;border-radius:50%;background:var(--ketchup);flex:none}
.status.open i{background:var(--pickle)}
.status.open{color:var(--pickle)}
h1{font-size:clamp(34px,9.4vw,44px)}
h1 em{font-style:italic;font-weight:500;color:var(--mustard)}
.lede{color:var(--ash);max-width:46ch}

.pop-photo{position:relative;margin:0 -16px;height:clamp(220px,64vw,300px);overflow:hidden;background:var(--char)}
.pop-photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 52%}
.pop-photo::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,var(--coal) 0,transparent 14%,transparent 70%,var(--coal) 100%)}
.pop-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pop-head .b-desc{color:var(--ash);font-size:15px}
.pop-head .price{font-size:20px;color:var(--mustard)}
.sheet-foot{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--coal);border-radius:0 0 22px 22px}
.sheet-foot .cta{min-height:50px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--ember);border-radius:10px;padding:8px 13px;font-size:14px;font-weight:600;min-height:40px}
.chip.rm[aria-pressed="true"]{background:var(--pickle);border-color:var(--pickle);color:#132000}
.chip.rm[aria-pressed="false"]{background:transparent;color:var(--ash);text-decoration:line-through;border-style:dashed}
legend small{text-transform:none;letter-spacing:0;font-weight:500;font-size:12px;margin-left:6px}
.chip.add[aria-pressed="true"]{background:var(--pickle);border-color:var(--pickle);color:#132000}
.chip small{font-weight:500;opacity:.8;font-variant-numeric:tabular-nums}
.allergens{font-size:13px;color:var(--ash);border-top:1px solid var(--line);padding-top:12px}
.allergens b{color:var(--bone);font-weight:600}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;flex:none}
.stepper button{background:none;border:0;width:42px;height:48px;font-size:22px;line-height:1}
.stepper output{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.cta{flex:1;border:0;border-radius:12px;background:var(--mustard);color:#1f1300;font-weight:700;font-size:16px;min-height:50px;padding:0 16px}
.cta:hover{filter:brightness(1.08)}
.cta.wide{width:100%}
.cta[disabled]{opacity:.5;cursor:not-allowed}

.menu{padding-top:8px;padding-bottom:28px}
.menu>h2{font-size:32px;margin-bottom:6px}
.cat{margin-top:22px}
.cat h3{font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mustard);padding-bottom:10px;border-bottom:1px solid var(--line)}
.rows{list-style:none;margin:0;padding:0}
.row{width:100%;display:flex;gap:14px;justify-content:space-between;align-items:center;padding:14px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:inherit}
@media (hover:hover) and (pointer:fine){.row:hover .plus{background:var(--mustard);color:#1f1300}}
.menu-hint{color:var(--ash);font-size:15px}
.row-main{min-width:0;flex:1}
.thumb{width:72px;height:72px;border-radius:10px;object-fit:cover;flex:none;background:var(--coal)}
.rname{display:block;font-size:17px;font-weight:700}
.rdesc{display:block;font-size:14px;color:var(--ash);margin-top:2px}
.row-side{display:flex;align-items:center;gap:10px;flex:none}
.plus{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--mustard);background:transparent;color:var(--mustard);font-size:24px;line-height:1;font-weight:500;flex:none}

.info{padding-top:8px;padding-bottom:36px;display:grid;gap:26px}
.info h2{font-size:22px;margin-bottom:10px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:600;width:34px;height:34px;border-radius:50%;background:var(--ember);color:var(--mustard);display:grid;place-items:center;font-size:15px}
.facts{display:grid;gap:6px;color:var(--ash)}
.facts b{color:var(--bone);font-weight:600}
footer{border-top:1px solid var(--line);padding:18px 16px 26px;color:var(--ash);font-size:13px;text-align:center}

.cartbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:20;border:0;border-radius:14px;background:var(--bone);color:#1c1410;min-height:58px;padding:0 18px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.cartbar span:last-child{font-variant-numeric:tabular-nums}

.scrim{position:fixed;inset:0;background:rgba(8,5,4,.7);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:92%;background:var(--coal);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;display:flex;flex-direction:column}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px 14px 10px}
.sheet-head h2{flex:1;font-size:20px}
.icon{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:none;font-size:18px;line-height:1;flex:none}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 16px 20px;display:grid;gap:14px;align-content:start}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:54px;cursor:pointer}
.opt input{accent-color:var(--pickle);width:20px;height:20px;flex:none;margin:0}
.opt span{flex:1;min-width:0}
.opt b{display:block;font-weight:600;font-size:15px}
.opt small{display:block;color:var(--ash);font-size:13px}
.opt em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.opt:has(input:checked){border-color:var(--pickle);background:rgba(155,203,88,.12)}
.sum{display:flex;justify-content:space-between;font-size:18px;font-weight:700}
.muted{color:var(--ash);font-size:14px}
.testnote{background:var(--ember);border-left:4px solid var(--mustard);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--bone)}
.provider{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:var(--ember);border-radius:12px;min-height:52px;padding:0 16px;font-weight:700;font-size:15px}
.provider:hover:not([disabled]){border-color:var(--ash)}
.provider[disabled]{opacity:.55;cursor:not-allowed}
.provider small{font-weight:600;font-size:12px;color:var(--ash)}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--ash)}
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--ash)}
.field input{font:inherit;color:var(--bone);background:var(--char);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:48px;width:100%}
.err{color:#ff9a86;font-size:13px;font-weight:600}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.slots label,.pay label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-weight:600;font-size:15px;cursor:pointer;font-variant-numeric:tabular-nums}
.slots label.first{grid-column:1/-1}
.slots input,.pay input{accent-color:var(--mustard);width:18px;height:18px;flex:none;margin:0}
.slots label:has(input:checked),.pay label:has(input:checked){border-color:var(--mustard);background:rgba(247,183,49,.10)}
.pay{display:grid;gap:8px}
.pay label.off{opacity:.55;cursor:not-allowed;justify-content:space-between}
.pay label.off span{display:flex;gap:8px;align-items:center}
.pay label .tag{margin-left:auto}
.paying{display:grid;justify-items:center;gap:10px;text-align:center;padding:24px 0}
.spin{width:46px;height:46px;border:4px solid var(--line);border-top-color:var(--mustard);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pickup-only{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--mustard);border:1px solid rgba(233,165,58,.45);border-radius:999px;padding:4px 10px}
.ticket{background:var(--bone);color:#1c1410;border-radius:16px;padding:18px;display:grid;gap:6px;text-align:center}
.ticket .no{font-family:var(--display);font-weight:600;font-size:44px;line-height:1}
.ticket dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;font-size:14px}
.ticket dt{color:#6b5a4c}
.ticket dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;color:var(--mustard);font-weight:700;padding:8px 0;text-decoration:underline;text-underline-offset:3px;justify-self:start}

.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:40;background:var(--bone);color:#1c1410;font-weight:700;font-size:14px;border-radius:999px;padding:9px 16px;box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:calc(100% - 32px)}

.ico{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:11px;background:var(--ember);color:var(--mustard);flex:none}
.ico svg{width:25px;height:25px;display:block}
.ico.sm{width:30px;height:30px;border-radius:8px}
.ico.sm svg{width:19px;height:19px}
.opt .ico{width:38px;height:38px;flex:none}
.opt .ico svg{width:23px;height:23px}
.line{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.line-main{flex:1;min-width:0;display:grid;gap:4px}
.line h4{font-size:16px;font-weight:700;line-height:1.25;padding-top:9px}
.line>.price{padding-top:9px}
.line .note{font-size:13px;color:var(--ash)}
.line .stepper button{width:36px;height:36px;font-size:19px}
.line .linkbtn{padding:6px 0}
.addlist{list-style:none;margin:6px 0 2px;padding:0;display:grid;gap:6px}
.addlist li{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.addlist .n{flex:1;min-width:0}
.addlist .p{color:var(--ash);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.line-actions{display:flex;align-items:center;gap:14px;margin-top:6px}
.closedbox{background:rgba(236,90,65,.12);border:1px solid rgba(236,90,65,.45);border-radius:12px;padding:11px 13px;font-size:14px;font-weight:600;color:var(--bone)}
.menu .closedbox{margin-top:12px}
.hlist,.hlist span{display:block}
footer a{color:var(--ash)}
.ticket .ilist{list-style:none;margin:10px 0 0;padding:12px 0 0;border-top:1px dashed #cbb9a6;display:grid;gap:10px;text-align:left}
.ticket .ilist>li{display:flex;gap:10px;align-items:flex-start}
.ticket .ilist b{display:block;font-size:14px;padding-top:2px}
.ticket .ilist small{display:block;font-size:13px;color:#6b5a4c}
.ticket .ico{background:#2a1d14}
.admin{max-width:920px;margin:0 auto;padding:6px 16px 48px}
.admin-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:6px 0 4px}
.admin-head h1{font-size:30px}
.admin-head .btnrow{gap:8px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:12px 0 18px;scrollbar-width:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:700;font-size:15px;color:var(--ash);white-space:nowrap;min-height:44px}
.tab[aria-selected="true"]{color:var(--bone);border-bottom-color:var(--mustard)}
.panel{display:grid;gap:16px}
.card{background:var(--coal);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.card h2{font-size:20px}
.dayrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 0;border-bottom:1px solid var(--line);min-height:64px}
.dayrow:last-child{border-bottom:0}
.dayrow>b{width:80px}
.times{display:flex;align-items:center;gap:6px;color:var(--ash)}
.in{font:inherit;color:var(--bone);background:var(--char);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;color-scheme:dark;width:100%}
.tsel{width:96px;font-variant-numeric:tabular-nums}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--ember);border:1px solid var(--line);position:relative;margin:0;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--ash);transition:transform .15s}
.switch input:checked{background:var(--pickle);border-color:var(--pickle)}
.switch input:checked::after{transform:translateX(18px);background:#132000}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--ember);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;min-height:44px;color:var(--bone);text-decoration:none;display:inline-flex;align-items:center}
.btn:hover{border-color:var(--ash)}
.btn.danger{border-color:rgba(236,90,65,.6);color:#ff9a86}
.btn.primary{background:var(--mustard);border-color:var(--mustard);color:#1f1300}
.splist,.olist,.toplist{list-style:none;margin:0;padding:0;display:grid}
.splist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.splist li span{flex:1}
.formgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:end}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--bone);color:#1c1410;border-color:var(--bone)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--coal);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.stat small{display:block;color:var(--ash);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.stat b{display:block;font-family:var(--display);font-weight:600;font-size:clamp(19px,5.4vw,30px);line-height:1.15;font-variant-numeric:tabular-nums;margin-top:4px}
.chart{position:relative}
.chart-cap{font-size:13px;color:var(--ash)}
.bars{display:grid;grid-template-columns:repeat(14,1fr);height:170px;border-bottom:1px solid var(--line);background:linear-gradient(var(--line),var(--line)) 0 0/100% 1px no-repeat}
.col{background:none;border:0;padding:0 1px;display:flex;align-items:flex-end;height:100%;min-width:0}
.col i{display:block;width:100%;background:var(--mustard);border-radius:4px 4px 0 0}
.col:hover i,.col:focus-visible i{filter:brightness(1.2)}
.xlabels{display:grid;grid-template-columns:repeat(14,1fr);font-size:11px;color:var(--ash);text-align:center;margin-top:6px;font-variant-numeric:tabular-nums}
.tip{position:absolute;z-index:2;background:var(--bone);color:#1c1410;border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600;white-space:nowrap;pointer-events:none;transform:translate(-50%,-100%);box-shadow:0 6px 18px rgba(0,0,0,.45)}
.olist li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.olist li:last-child,.toplist li:last-child{border-bottom:0}
.olist small{grid-column:1/-1;color:var(--ash);font-size:13px}
.toplist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-weight:600}
.toplist li .n{flex:1}
.toplist li em{font-style:normal;color:var(--ash);font-variant-numeric:tabular-nums}
.admin-login{max-width:380px;margin:30px auto}
@media (min-width:760px){.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}}

@media (max-width:759px){
  .sheet{top:0;height:100%;height:100dvh;max-height:none;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px)}
  .sheet-foot{border-radius:0}
}
body.locked{position:fixed;left:0;right:0;overflow:hidden}
@media (min-width:760px){
  .banner{min-height:clamp(400px,46vw,600px);display:flex;align-items:center;max-width:1500px;margin:0 auto}
  .banner-img{position:absolute;inset:0}
  .banner-img img{height:100%;object-fit:cover;object-position:right center}
  .banner-img::after{background:linear-gradient(to right,var(--char) 0,rgba(21,12,7,.72) 26%,transparent 54%),linear-gradient(to top,var(--char) 0,transparent 20%),linear-gradient(to bottom,var(--char) 0,transparent 10%),linear-gradient(to left,var(--char) 0,transparent 5%)}
  .banner-copy{margin-top:0;width:100%;padding-top:44px;padding-bottom:44px}
  .banner-copy>*{max-width:min(46%,470px)}

/* ---------- Hero steam ----------
   Soft wisps rising off the bun. Bun position is measured from the photo (normalised to each crop),
   then mapped through object-fit: cover / object-position: right so it tracks the burger at any size. */
function startSteam(){
  if (reduceMotion) return;
  var box = $('.banner-img'), img = $('#heroImg'), cv = document.createElement('canvas'), g;
  try { g = cv.getContext('2d'); } catch (e) { return; }
  if (!g) return;
  cv.className = 'steam'; cv.setAttribute('aria-hidden', 'true'); box.appendChild(cv);

  var spr = document.createElement('canvas'); spr.width = spr.height = 64;
  var sg = spr.getContext('2d'), rg = sg.createRadialGradient(32, 32, 0, 32, 32, 32);
  rg.addColorStop(0, 'rgba(255,246,236,0.85)'); rg.addColorStop(0.45, 'rgba(255,241,228,0.32)'); rg.addColorStop(1, 'rgba(255,241,228,0)');
  sg.fillStyle = rg; sg.fillRect(0, 0, 64, 64);

  // cx/hw: bun centre and half-width (fraction of image width); top/base: dome top and base (fraction of height)
  var SPOT = { wide: { cx: 0.750, hw: 0.146, top: 0.2615, base: 0.452 }, narrow: { cx: 0.540, hw: 0.2686, top: 0.1755, base: 0.388 } };
  var W = 0, H = 0, dpr = 1, geo = null, parts = [], last = 0, acc = 0, visible = true;

  function layout(){
    var r = box.getBoundingClientRect(); W = r.width; H = r.height; if (!W || !H) { geo = null; return; }
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    var iw = img.naturalWidth, ih = img.naturalHeight; if (!iw || !ih) { geo = null; return; }
    var s = (img.currentSrc || img.src).indexOf('hero-m') >= 0 ? SPOT.narrow : SPOT.wide;
    var sc = Math.max(W / iw, H / ih), dw = iw * sc, dh = ih * sc, ox = W - dw, oy = (H - dh) / 2;
    var old = geo;
    geo = { cx: ox + s.cx * dw, hw: s.hw * dw, top: oy + s.top * dh, base: oy + s.base * dh };
    if (!old) { parts = []; for (var i = 0; i < 260; i++) step(1 / 60, false); }
    else if (old.hw) { var k = geo.hw / old.hw; parts.forEach(function(p){ p.x0 = geo.cx + (p.x0 - old.cx) * k; p.y0 = geo.base + (p.y0 - old.base) * k; }); }
  }
  function spawn(){
    var d = (Math.random() * 2 - 1) * 0.8, x = geo.cx + d * geo.hw;
    var y = geo.base - (geo.base - geo.top) * Math.sqrt(1 - d * d) + geo.hw * 0.04;
    parts.push({ x0: x, y0: y, age: 0, life: 3.4 + Math.random() * 2.6, ph: Math.random() * 6.28,
      sp: 0.7 + Math.random() * 0.6, dr: (Math.random() - 0.5) * 0.35 + d * 0.12, sz: 0.7 + Math.random() * 0.6, a: 0.08 + Math.random() * 0.07 });
  }
  function step(dt, draw){
    acc += dt * 11;
    while (acc >= 1) { if (parts.length < 80) spawn(); acc -= 1; }
    if (draw) { g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H); }
    var B = geo.hw * 2;
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i]; p.age += dt;
      var k = p.age / p.life; if (k >= 1) { parts.splice(i, 1); continue; }
      if (!draw) continue;
      var y = p.y0 - B * (0.75 * p.sp * k + 0.25 * k * k);
      var x = p.x0 + B * (p.dr * k + 0.05 * k * Math.sin(p.ph + p.age * 1.4));
      var size = B * (0.09 + 0.34 * k) * p.sz;
      var al = p.a * Math.min(1, k / 0.22) * Math.pow(1 - k, 1.4);
      g.globalAlpha = al;
      g.drawImage(spr, x - size / 2, y - size * 0.8, size, size * 1.6);
    }
    if (draw) g.globalAlpha = 1;
  }
  function frame(now){
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (now - last) / 1000 || 0.016); last = now;
    if (!visible || document.hidden || !geo) return;
    step(dt, true);
  }
  if (window.ResizeObserver) new ResizeObserver(layout).observe(box); else window.addEventListener('resize', layout);
  img.addEventListener('load', function(){ geo = null; layout(); });
  if (window.IntersectionObserver) new IntersectionObserver(function(en){ visible = en[0].isIntersecting; }).observe(box);
  layout();
  requestAnimationFrame(frame);
}

function optGroup(name, legend, type, items, noneLabel, isOn){

  if (noneLabel) html += '<label class="opt" for="' + name + '-none"><input type="radio" name="' + name + '" id="' + name + '-none" value=""' + (isOn('') ? ' checked' : '') + '><span><b>' + noneLabel + '</b></span></label>';
  items.forEach(function(it){
    html += '<label class="opt" for="' + name + '-' + it.id + '"><input type="' + type + '" name="' + name + '" id="' + name + '-' + it.id + '" value="' + it.id + '"' + (isOn(it.id) ? ' checked' : '') + '>' + icon(iconFor(it.id)) +
      '<span><b>' + esc(lab(it)) + '</b><small>' + esc(state.lang === 'no' ? it.dno : it.den) + '</small></span><em>+' + kr(it.price) + '</em></label>';
  });
  return html + '</div></fieldset>';
}
function catItems(cat){ return OTHER.filter(function(c){ return c.cat === cat; })[0].items; }
function saveCart(){ store.set('bulls.cart', state.cart); renderCartBits(); }
function renderCartBits(){
  var n = cartCount();
  $('#cartCount').textContent = n;
  var bar = $('#cartBar'), showBar = n > 0 && $('#sheet').hidden && !adminOpen;
  bar.hidden = !showBar; document.body.classList.toggle('has-cart', showBar);
  $('#cartBarLeft').textContent = t('cart') + ' · ' + n + ' ' + (n === 1 ? t('item1') : t('itemN'));
  $('#cartBarRight').textContent = kr(cartTotal());
}
var toastTimer = 0;
function toast(msg){
  var el = $('#toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.hidden = true; }, 1600);
}

/* ---------- Pickup times ---------- */
function pad(n){ return (n < 10 ? '0' : '') + n; }
function hhmm(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function slotLabel(w, i){ var s = hhmm(w.slots[i]); return i === 0 ? t('asap') + ' ' + s : s; }
function addsList(l){
  var a = addsOf(l); if (!a.length) return '';
  return '<ul class="addlist">' + a.map(function(x){
    var it = OTHER_BY_ID[x];
    return '<li>' + icon(iconFor(x), 'sm') + '<span class="n">' + esc(lab(it)) + '</span><span class="p">+' + kr(it.price) + '</span></li>';
  }).join('') + '</ul>';
}
function orderLinesHtml(lines){
  return '<ul class="ilist">' + lines.map(function(l){
    var adds = (l.adds || []).filter(function(x){ return OTHER_BY_ID[x]; }).map(function(x){ return lab(OTHER_BY_ID[x]); }).join(', ');
    var note = lineNote({ rm: l.rm, ex: l.ex });
    return '<li>' + icon(iconFor(l.id), 'sm') + '<span><b>' + l.q + ' × ' + esc(nameOf(l.id)) + '</b>' + (note ? '<small>' + esc(note) + '</small>' : '') + (adds ? '<small>+ ' + esc(adds) + '</small>' : '') + '</span></li>';
  }).join('') + '</ul>';
}

/* ---------- Sign-in ---------- */
function signInWithProvider(provider){
  // Real sign-in goes here once AUTH has keys:
  //   Google:   Google Identity Services with AUTH.googleClientId, then verify the ID token on the server.
  //   Facebook: Facebook Login SDK with AUTH.facebookAppId, then verify the access token on the server.
  // Until then this signs in a test profile and collects nothing.
  var name = provider === 'google' ? 'Test Testesen' : 'Prøve Prøvesen';
  setUser({ name: name, via: provider, phone: '' });
}
function setUser(u){
  state.user = u; store.set('bulls.user', u); renderAccount();
  state.view = state.afterSignIn; state.formErr = null; renderSheet(true);
}

/* ---------- Sheet ---------- */
var lastFocus = null;
function openSheet(view){
  lastFocus = document.activeElement;
  state.view = view; state.formErr = null;
  $('#scrim').hidden = false; $('#sheet').hidden = false;
  lockScroll(); renderSheet(true); renderCartBits();
}
// Freeze the page behind the popup (position:fixed also works on iOS Safari, where overflow:hidden alone does not).
var lockedY = null;
function lockScroll(){
  if (lockedY !== null) return;
  lockedY = window.scrollY || window.pageYOffset || 0;
  document.body.style.top = -lockedY + 'px';
  document.body.classList.add('locked');
}
function unlockScroll(){
  if (lockedY === null) return;
  document.body.classList.remove('locked'); document.body.style.top = '';
  window.scrollTo(0, lockedY); lockedY = null;
}
var payTimer = 0;
function payName(p){ return p === 'card' ? t('payCardLower') : 'Vipps'; }
function payButtonText(){ return t('payNow') + ' ' + kr(cartTotal()) + ' ' + t('with') + ' ' + payName(state.pay); }
function closeSheet(){
  clearTimeout(payTimer);
  $('#scrim').hidden = true; $('#sheet').hidden = true; state.draft = null; unlockScroll(); renderCartBits();
  if (state.view === 'done') state.order = null;
  if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
}

/* ---------- Events ---------- */
$('#menuBody').addEventListener('click', function(e){
  var el = e.target.closest('[data-open]'); if (el) openBurger(el.dataset.open);
});
$('#orderCta').addEventListener('click', function(){ $('#menu').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' }); });
$('#langBtn').addEventListener('click', function(){
  state.lang = state.lang === 'no' ? 'en' : 'no'; store.set('bulls.lang', state.lang); renderAll();
  if (!$('#sheet').hidden) renderSheet(false);
  if (adminOpen) renderAdmin();
});
$('#cartBtn').addEventListener('click', function(){ openSheet('cart'); });
$('#cartBar').addEventListener('click', function(){ openSheet('cart'); });
$('#acctBtn').addEventListener('click', function(){ if (state.user) openSheet('account'); else { state.afterSignIn = 'account'; openSheet('signin'); } });
$('#sheetClose').addEventListener('click', closeSheet);
$('#scrim').addEventListener('click', closeSheet);
$('#sheetBack').addEventListener('click', function(){ state.view = this.dataset.to || 'cart'; state.formErr = null; renderSheet(true); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
$('#sheet').addEventListener('click', function(e){
  var el = e.target.closest('button'); if (!el) return;
  var d = state.draft;
  if (d && el.dataset.rm) { d.removed[el.dataset.rm] = !d.removed[el.dataset.rm]; el.setAttribute('aria-pressed', String(!d.removed[el.dataset.rm])); refreshDraft(); return; }
  if (d && el.dataset.x) { d.extras[el.dataset.x] = !d.extras[el.dataset.x]; el.setAttribute('aria-pressed', String(!!d.extras[el.dataset.x])); refreshDraft(); return; }
  if (d && el.dataset.dq) { d.qty = Math.max(1, Math.min(20, d.qty + Number(el.dataset.dq))); refreshDraft(); return; }
  if (el.dataset.line) {
    var l = state.cart[Number(el.dataset.line)]; if (!l) return;
    l.qty += Number(el.dataset.d); if (l.qty <= 0) state.cart.splice(Number(el.dataset.line), 1);
    saveCart(); renderSheet(false); return;
  }
  if (el.dataset.edit) { editLine(Number(el.dataset.edit)); return; }
  var act = el.dataset.act; if (!act) return;
  if (act === 'checkout') { if (!orderWindow().ok) { renderSheet(false); return; } state.afterSignIn = 'pickup'; state.view = state.user ? 'pickup' : 'signin'; renderSheet(true); }
  else if (act === 'google' || act === 'facebook') signInWithProvider(act);
  else if (act === 'switch') { state.afterSignIn = 'pickup'; state.view = 'signin'; renderSheet(true); }
  else if (act === 'signout') { state.user = null; store.set('bulls.user', null); renderAccount(); closeSheet(); }
  else if (act === 'place') {
    var w = orderWindow();
    if (!w.ok) { state.view = 'cart'; renderSheet(true); toast(closedMsg(w)); return; }
    var i = Math.min(state.slot, w.slots.length - 1), today = ymd(new Date());
    var nToday = orders.filter(function(o){ return ymd(new Date(o.ts)) === today; }).length;
    var order = { no: 'B-' + (101 + nToday), ts: 0, pickup: w.slots[i].getTime(), when: hhmm(w.slots[i]), name: state.user.name, via: state.user.via, total: cartTotal(), pay: state.pay,
      lines: state.cart.map(function(l){ return { id: l.id, q: l.qty, rm: (l.rm || []).slice(), ex: (l.ex || []).slice(), adds: addsOf(l), tot: lineUnit(l) * l.qty }; }) };
    state.view = 'paying'; renderSheet(true);
    // Test payment. A real one sends the customer to Vipps or a card checkout and only confirms the order when the payment provider says it is paid.
    clearTimeout(payTimer);
    payTimer = setTimeout(function(){
      if (state.view !== 'paying' || $('#sheet').hidden) return;
      order.ts = Date.now(); orders.push(order); saveOrders();
      state.order = order; state.cart = []; saveCart(); state.view = 'done'; renderSheet(true);
    }, 1600);
  }
  else if (act === 'close') closeSheet();
  else if (act === 'saveBurger' && d) {
    var editing = d.edit != null;
    putLine(draftLine(), d.edit);
    state.draft = null;
    if (editing) { state.view = 'cart'; renderSheet(true); }
    else { closeSheet(); toast(t('added')); }
  }
});
$('#sheetBody').addEventListener('change', function(e){
  var n = e.target.name, d = state.draft;
  if (n === 'slot') state.slot = Number(e.target.value);
  else if (n === 'pay') { state.pay = e.target.value; var pb = $('#payBtn'); if (pb) pb.textContent = payButtonText(); }
  else if (d && n === 'side') { d.sides = $$('input[name="side"]:checked', $('#sheetBody')).map(function(x){ return x.value; }); refreshDraft(); }
  else if (d && n === 'drink') { d.drink = e.target.value || null; refreshDraft(); }
  else if (d && n === 'dip') { d.dips = $$('input[name="dip"]:checked', $('#sheetBody')).map(function(x){ return x.value; }); refreshDraft(); }
});
$('#sheetBody').addEventListener('submit', function(e){
  e.preventDefault();
  if (e.target.id !== 'guestForm') return;
  var name = $('#guestName').value.trim(), phone = $('#guestPhone').value.replace(/[\s+-]/g, '').replace(/^(0047|47)(?=\d{8}$)/, '');
  if (name.length < 2) { state.formErr = t('errName'); renderSheet(false); $('#guestPhone').value = phone; $('#guestName').focus(); return; }
  if (!/^\d{8}$/.test(phone)) { state.formErr = t('errPhone'); renderSheet(false); $('#guestName').value = name; $('#guestPhone').focus(); return; }
  setUser({ name: name, via: 'guest', phone: phone });
});

/* ---------- Admin panel (#admin) ----------
   Test version: hours, PIN and orders live in this browser's localStorage. The PIN only keeps
   casual visitors out; real protection needs a server login. */

var adminAuthed = false;
try { adminAuthed = sessionStorage.getItem('bulls.adm') === '1'; } catch (e) {}
function setAuthed(v){ adminAuthed = v; try { if (v) sessionStorage.setItem('bulls.adm', '1'); else sessionStorage.removeItem('bulls.adm'); } catch (e) {} }
function route(){
  adminOpen = location.hash === '#admin';
  $('#top').hidden = adminOpen; $('#siteFoot').hidden = adminOpen;
  $('#acctBtn').hidden = adminOpen; $('#cartBtn').hidden = adminOpen;
  $('#admin').hidden = !adminOpen;
  if (adminOpen) { if (!$('#sheet').hidden) closeSheet(); adminErr = ''; renderAdmin(); window.scrollTo(0, 0); }
  renderCartBits();
}
function rangeStart(){
  var now = new Date(), f = new Date(now); f.setHours(0, 0, 0, 0);
  if (adminRange === '7') f.setDate(f.getDate() - 6);
  else if (adminRange === 'month') f.setDate(1);
  else if (adminRange === 'all') return 0;
  return f.getTime();
}
function errP(){ return adminErr ? '<p class="err" role="alert">' + esc(adminErr) + '</p>' : ''; }
var TIMES = (function(){ var a = []; for (var m = 0; m < 1440; m += 15) a.push(pad(Math.floor(m / 60)) + ':' + pad(m % 60)); return a; })();
function timeIn(id, val, label, attrs){
  var list = TIMES.indexOf(val) < 0 ? TIMES.concat([val]).sort() : TIMES;
  return '<select class="in tsel" ' + (id ? 'id="' + id + '" ' : '') + (attrs || '') + ' aria-label="' + esc(label) + '">' + list.map(function(x){ return '<option' + (x === val ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select>';
}

      '<div class="btnrow"><button type="button" class="btn" data-a="copyMon">' + t('a_copyAll') + '</button></div></div>';
  }

  else if (adminTab === 'special') {
    var today = ymd(new Date());
    var list = admin.special.filter(function(s){ return s.date >= today; }).sort(function(a, b){ return a.date < b.date ? -1 : 1; });
    html += '<div class="card"><h2>' + t('a_spAddT') + '</h2><p class="muted">' + t('a_spHint') + '</p><form id="spForm" novalidate style="display:grid;gap:12px">' +
      '<div class="formgrid"><div class="field"><label for="spDate">' + t('a_spDate') + '</label><input class="in" id="spDate" type="date" min="' + today + '"></div>' +
      '<div class="field"><label for="spNote">' + t('a_spNote') + '</label><input class="in" id="spNote" type="text" maxlength="40"></div></div>' +
      '<label class="switch"><input type="checkbox" id="spClosed" checked><span>' + t('a_spClosed') + '</span></label>' +
      '<span class="times" id="spTimes" hidden>' + timeIn('spOpen', '14:00', t('a_from')) + '–' + timeIn('spClose', '22:00', t('a_to')) + '</span>' + errP() +
      '<button type="submit" class="btn primary" style="justify-self:start">' + t('a_spAdd') + '</button></form></div>' +
      '<div class="card"><h2>' + t('a_spUpcoming') + '</h2>' + (list.length ? '<ul class="splist">' + list.map(function(s){
        return '<li><span><b>' + dayDate(s.date) + '</b>' + (s.note ? ' · ' + esc(s.note) : '') + '<br><small class="muted">' + (s.closed ? t('a_closedDay') : s.open + '–' + s.close) + '</small></span>' +
          '<button type="button" class="btn danger" data-a="delSp" data-date="' + s.date + '">' + t('a_del') + '</button></li>';
      }).join('') + '</ul>' : '<p class="muted">' + t('a_spNone') + '</p>') + '</div>';
  }

  else if (adminTab === 'earn') {
    var from = rangeStart(), sel = orders.filter(function(o){ return o.ts >= from; });
    var rev = sel.reduce(function(s, o){ return s + o.total; }, 0), cnt = sel.length;
    html += '<div class="seg" role="group" aria-label="' + t('a_period') + '">' + [['today', t('a_today')], ['7', t('a_7')], ['month', t('a_month')], ['all', t('a_all')]].map(function(r){
      return '<button type="button" data-range="' + r[0] + '" aria-pressed="' + (adminRange === r[0]) + '">' + r[1] + '</button>';
    }).join('') + '</div>' +
      '<div class="stats"><div class="stat"><small>' + t('a_rev') + '</small><b>' + kr(rev) + '</b></div><div class="stat"><small>' + t('a_orders') + '</small><b>' + cnt + '</b></div>' +
      '<div class="stat"><small>' + t('a_avg') + '</small><b>' + kr(cnt ? rev / cnt : 0) + '</b></div></div>';

    var now = new Date(), days = [], byK = {};
    for (var k = 13; k >= 0; k--) { var d = new Date(now); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - k); var x = { k: ymd(d), d: d, sum: 0, n: 0 }; days.push(x); byK[x.k] = x; }
    orders.forEach(function(o){ var x = byK[ymd(new Date(o.ts))]; if (x) { x.sum += o.total; x.n++; } });
    var max = Math.max.apply(null, days.map(function(x){ return x.sum; }));
    html += '<div class="card"><h2>' + t('a_chart') + '</h2><p class="chart-cap">' + (max ? t('a_max') + ': ' + kr(max) : t('a_noOrders14')) + '</p>' +
      '<div class="chart"><div class="bars">' + days.map(function(x){
        var lbl = dayDate(x.k) + ': ' + kr(x.sum) + ' · ' + x.n + ' ' + t('a_ordersN');
        return '<button type="button" class="col" data-tip="' + esc(lbl) + '" aria-label="' + esc(lbl) + '"><i style="height:' + (max ? (x.sum / max * 100).toFixed(1) : 0) + '%"></i></button>';
      }).join('') + '</div><div class="xlabels" aria-hidden="true">' + days.map(function(x){ return '<span>' + x.d.getDate() + '</span>'; }).join('') + '</div>' +
      '<div class="tip" id="barTip" hidden></div></div></div>';

    var cnts = {};
    sel.forEach(function(o){ o.lines.forEach(function(l){ cnts[l.id] = (cnts[l.id] || 0) + l.q; (l.adds || []).forEach(function(a){ cnts[a] = (cnts[a] || 0) + l.q; }); }); });
    var top = Object.keys(cnts).filter(function(id){ return BURGERS[id] || OTHER_BY_ID[id]; }).sort(function(a, b){ return cnts[b] - cnts[a]; }).slice(0, 8);
    var recent = sel.slice(-15).reverse();
    html += '<div class="two"><div class="card"><h2>' + t('a_top') + '</h2>' + (top.length ? '<ul class="toplist">' + top.map(function(id){
        return '<li>' + icon(iconFor(id), 'sm') + '<span class="n">' + esc(nameOf(id)) + '</span><em>' + cnts[id] + ' ' + t('a_pcs') + '</em></li>';
      }).join('') + '</ul>' : '<p class="muted">' + t('a_noOrders') + '</p>') + '</div>' +
      '<div class="card"><h2>' + t('a_recent') + '</h2>' + (recent.length ? '<ul class="olist">' + recent.map(function(o){
        var d = new Date(o.ts), sum = o.lines.map(function(l){ return l.q + '× ' + nameOf(l.id); }).join(', ');
        return '<li><span><b>' + esc(o.no) + '</b> · ' + esc(o.name) + '</span><span class="price">' + kr(o.total) + '</span><small>' + dayDate(ymd(d)) + ' ' + hhmm(d) + ' · ' + (o.pay === 'card' ? t('payCard') : 'Vipps') + ' · ' + esc(sum) + '</small></li>';
      }).join('') + '</ul>' : '<p class="muted">' + t('a_noOrders') + '</p>') + '</div></div>' +
      '<div class="btnrow"><button type="button" class="btn" data-a="demo">' + t('a_demo') + '</button><button type="button" class="btn danger" data-a="clear">' + t('a_clear') + '</button></div>';
  }

  else if (adminTab === 'set') {
    html += '<div class="card"><h2>' + t('a_ordering') + '</h2><label class="switch"><input type="checkbox" data-k="paused"' + (admin.paused ? ' checked' : '') + '><span>' + t('a_pause') + '</span></label>' +
      '<p class="muted">' + t('a_pauseHint') + '</p><div class="field"><label for="prepSel">' + t('a_prep') + '</label><select class="in" id="prepSel" style="max-width:200px">' +
      PREPS.map(function(p){ return '<option value="' + p + '"' + (p === admin.prep ? ' selected' : '') + '>' + p + ' min</option>'; }).join('') + '</select></div></div>' +
      '<div class="card"><h2>' + t('a_pinT') + '</h2><form id="newPinForm" novalidate style="display:grid;gap:12px;max-width:320px"><div class="field"><label for="newPin">' + t('a_newPin') + '</label>' +
      '<input class="in" id="newPin" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div>' + errP() +
      '<button type="submit" class="btn primary" style="justify-self:start">' + t('a_save') + '</button></form></div>';
  }
  html += '<p class="testnote">' + t('a_note') + '</p>';
  A.innerHTML = html + '</div>';
}
function addDemoOrders(){
  var now = new Date(), add = [], sides = catItems('sides'), dips = catItems('dips'), drinks = catItems('drinks');
  var names = ['Ola', 'Kari', 'Emma', 'Jonas', 'Sara', 'Ali', 'Nora', 'Lars', 'Ida', 'Mats', 'Leah', 'Henrik', 'Amir', 'Sofie'];
  var pick = function(a){ return a[Math.floor(Math.random() * a.length)]; };
  for (var k = 29; k >= 0; k--) {
    var d = new Date(now); d.setDate(d.getDate() - k); var sp = spanFor(d); if (!sp) continue;
    var n = 6 + Math.floor(Math.random() * 18) + (wd(d) >= 4 ? 8 : 0);
    for (var j = 0; j < n; j++) {
      var ts = sp.start.getTime() + Math.random() * Math.max(0, sp.end - sp.start - 30 * 60000); if (ts > now.getTime()) continue;
      var lines = [], q = 1 + (Math.random() < .3 ? 1 : 0) + (Math.random() < .1 ? 1 : 0);
      for (var m = 0; m < q; m++) {
        var l = { id: pick(BURGER_ORDER), q: 1, rm: [], ex: Math.random() < .2 ? ['cheese'] : [], adds: [] };
        var want = function(id){ if (l.adds.indexOf(id) < 0) l.adds.push(id); };
        if (Math.random() < .8) want(pick(sides).id);
        if (Math.random() < .25) want(pick(sides).id);
        if (Math.random() < .4) want(pick(dips).id);
        if (Math.random() < .7) want(pick(drinks).id);
        l.tot = unitPrice(l.id, toSet(l.ex)) + l.adds.reduce(function(s, x){ return s + OTHER_BY_ID[x].price; }, 0);
        lines.push(l);
      }
      add.push({ no: '', ts: ts, pickup: ts + admin.prep * 60000, when: '', name: pick(names), via: 'guest', total: lines.reduce(function(s, l){ return s + l.tot; }, 0), pay: Math.random() < .7 ? 'vipps' : 'card', lines: lines, demo: true });
    }
  }
  orders = orders.concat(add).sort(function(a, b){ return a.ts - b.ts; });
  var seq = {}; orders.forEach(function(o){ var k = ymd(new Date(o.ts)); seq[k] = (seq[k] || 100) + 1; if (o.demo) { o.no = 'T-' + seq[k]; o.when = hhmm(new Date(o.pickup)); } });
  saveOrders();
}
function showTip(c){
  var tip = $('#barTip'); if (!tip) return;
  var ch = c.closest('.chart').getBoundingClientRect(), r = c.getBoundingClientRect(), bar = c.firstElementChild.getBoundingClientRect();
  tip.textContent = c.dataset.tip; tip.hidden = false;
  var tw = tip.offsetWidth, x = r.left + r.width / 2 - ch.left;
  x = Math.max(tw / 2, Math.min(ch.width - tw / 2, x));
  tip.style.left = x + 'px'; tip.style.top = (bar.top - ch.top - 6) + 'px';
}
$('#admin').addEventListener('mouseover', function(e){ var c = e.target.closest('.col'); if (c) showTip(c); });
$('#admin').addEventListener('focusin', function(e){ var c = e.target.closest('.col'); if (c) showTip(c); });
$('#admin').addEventListener('mouseout', function(e){ var c = e.target.closest('.col'); if (c && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.col'))) { var tp = $('#barTip'); if (tp) tp.hidden = true; } });
$('#admin').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab) { adminTab = b.dataset.tab; adminErr = ''; confirmClear = false; renderAdmin(); return; }
  if (b.dataset.range) { adminRange = b.dataset.range; confirmClear = false; renderAdmin(); return; }
  if (b.classList.contains('col')) { showTip(b); return; }
  var a = b.dataset.a; if (!a) return;
  if (a === 'logout') { setAuthed(false); location.hash = '#top'; }
  else if (a === 'copyMon') { var m = admin.hours[0]; admin.hours = admin.hours.map(function(){ return { closed: m.closed, open: m.open, close: m.close }; }); saveAdmin(); renderAdmin(); toast(t('a_saved')); }
  else if (a === 'delSp') { admin.special = admin.special.filter(function(s){ return s.date !== b.dataset.date; }); saveAdmin(); renderAdmin(); toast(t('a_saved')); }
  else if (a === 'demo') { addDemoOrders(); renderAdmin(); toast(t('a_demoDone')); }
  else if (a === 'clear') {
    if (!confirmClear) { confirmClear = true; b.textContent = t('a_confirm'); return; }
    confirmClear = false; orders = []; saveOrders(); renderAdmin();
  }
});
$('#admin').addEventListener('change', function(e){
  var el = e.target, k = el.dataset.k, i = Number(el.dataset.day);
  if (k === 'on') { admin.hours[i].closed = !el.checked; saveAdmin(); renderAdmin(); toast(t('a_saved')); }
  else if (k === 'open' || k === 'close') { if (okTime(el.value)) { admin.hours[i][k] = el.value; saveAdmin(); toast(t('a_saved')); } }
  else if (k === 'paused') { admin.paused = el.checked; saveAdmin(); renderAdmin(); toast(t('a_saved')); }
  else if (el.id === 'prepSel') { admin.prep = Number(el.value); saveAdmin(); toast(t('a_saved')); }
  else if (el.id === 'spClosed') { $('#spTimes').hidden = el.checked; }
});
$('#admin').addEventListener('submit', function(e){
  e.preventDefault(); var f = e.target;
  if (f.id === 'pinForm') {
    if ($('#pinIn').value === admin.pin) { setAuthed(true); adminErr = ''; } else adminErr = t('a_badPin');
    renderAdmin(); if (!adminAuthed) $('#pinIn').focus();
  } else if (f.id === 'spForm') {
    var d = $('#spDate').value, cl = $('#spClosed').checked, o = $('#spOpen').value, c = $('#spClose').value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || d < ymd(new Date())) { adminErr = t('a_badDate'); renderAdmin(); return; }
    if (!cl && (!okTime(o) || !okTime(c))) { adminErr = t('a_badTime'); renderAdmin(); return; }
    admin.special = admin.special.filter(function(s){ return s.date !== d; }).concat([{ date: d, closed: cl, open: okTime(o) ? o : '14:00', close: okTime(c) ? c : '22:00', note: $('#spNote').value.trim().slice(0, 40) }]);
    adminErr = ''; saveAdmin(); renderAdmin(); toast(t('a_saved'));
  } else if (f.id === 'newPinForm') {
    var p = $('#newPin').value;
    if (!/^\d{4,8}$/.test(p)) { adminErr = t('a_pinBad'); renderAdmin(); return; }
    admin.pin = p; adminErr = ''; saveAdmin(); renderAdmin(); toast(t('a_pinSaved'));
  }
});
window.addEventListener('hashchange', route);

function renderAll(){
  applyI18n(); renderStatus(); renderHours(); renderAccount(); renderMenu(); renderCartBits();
}

renderAll();
route();
preloadPhotos();
startSteam();
setInterval(renderStatus, 60000);
})();
